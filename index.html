<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magma & Mecha</title>
<meta name="theme-color" content="#d9480f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magma & Mecha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera tipo etiqueta de taller + pestañas fijas; cada sección es una hoja de trabajo con lista + formulario en panel */
:root{
  --bg:#f1efec; --surface:#fbfaf8; --sunk:#e7e3de; --ink:#26201d; --muted:#6f6660; --line:#d9d3cc;
  --ember:#d9480f; --ember-soft:#fde3d4; --wick:#3c2f6b;
  --ok:#2f7d4f; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecc8; --bad:#b3261e; --bad-soft:#f8dad7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191513; --surface:#221d1a; --sunk:#2c2622; --ink:#f0ebe6; --muted:#a99f97; --line:#3a332e;
  --ember:#ff7a3d; --ember-soft:#4a2414; --wick:#b8a8ff;
  --ok:#6cc790; --ok-soft:#173726; --warn:#f0b44a; --warn-soft:#3d2c0c; --bad:#ff8b80; --bad-soft:#47201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191513; --surface:#221d1a; --sunk:#2c2622; --ink:#f0ebe6; --muted:#a99f97; --line:#3a332e;
  --ember:#ff7a3d; --ember-soft:#4a2414; --wick:#b8a8ff;
  --ok:#6cc790; --ok-soft:#173726; --warn:#f0b44a; --warn-soft:#3d2c0c; --bad:#ff8b80; --bad-soft:#47201c; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:baseline;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:-.01em}
.brand h1 .amp{color:var(--ember)}
.brand span{color:var(--muted);font-size:.85rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ember)}
nav.tabs button:focus-visible{outline:2px solid var(--ember);outline-offset:-2px}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:1.05rem;margin:0 0 8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch;font-size:.92rem}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:600 .9rem var(--f-body);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:400 .95rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-num)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ember{background:var(--ember-soft);color:var(--ember)}
.wick{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 8px;border-radius:6px;font:700 .9rem var(--f-num);background:var(--wick);color:var(--surface)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
/* pedidos */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;font-size:.92rem;flex-wrap:wrap}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert b{color:inherit}
.order{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.order:hover{border-color:var(--muted)}
.order .stripe{background:var(--line)}
.order.s-bad .stripe{background:var(--bad)} .order.s-warn .stripe{background:var(--warn)} .order.s-ok .stripe{background:var(--ok)}
.order .body{padding:12px 0;min-width:0}
.order .side{padding:12px 14px 12px 0;text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.order .name{font-weight:600;font-size:1rem}
.order .meta{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:110px}
.bar i{display:block;height:100%;background:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:500 .84rem var(--f-body);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;border-bottom:0}
/* result */
.result{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:18px}
.result .big{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.2}
.result .sub{opacity:.75;font-size:.9rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.kv .total{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:6px}
/* drawer */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;gap:8px;align-items:end;background:var(--bg);border-radius:8px;padding:10px}
.line.item{grid-template-columns:1fr 70px 110px 34px}
.line.abono{grid-template-columns:1fr 1fr 34px}
.line.ins{grid-template-columns:1.4fr .8fr 1fr .8fr .6fr 34px}
.line.calc{grid-template-columns:1fr 90px 34px}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;height:36px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.line .cost{font-family:var(--f-num);font-size:.9rem;text-align:right;padding-bottom:9px}
@media (max-width:560px){
  .line.ins{grid-template-columns:1fr 1fr 34px}
  .line.ins .ins-name{grid-column:1 / -1}
  .line.item{grid-template-columns:1fr 1fr 34px}
  .line.item .it-sel{grid-column:1 / -1}
  .order{grid-template-columns:6px 1fr}
  .order .side{grid-column:2;align-items:flex-start;text-align:left;padding:0 14px 12px 0}
}
.hint{font-size:.82rem;color:var(--muted)}
.pbar{flex:1;min-width:60px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:6px}
.row .pbar{margin-top:0}
.pbar i{display:block;height:100%;background:var(--wick);border-radius:4px;transition:width .2s}
.pbar i.ok{background:var(--ok)} .pbar i.warn{background:var(--warn)} .pbar i.bad{background:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.rcard{display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.rcard:hover{border-color:var(--muted)}
.sw{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.sw.fr{background:var(--ember-soft);color:var(--ember);font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.status{font-size:.85rem;color:var(--muted);padding:8px 0}
.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .stk{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.chart .mo{background:var(--wick)} .chart .ga{background:var(--ember)}
.chart .lbl{font-size:.74rem;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:30}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Magma <span class="amp">&amp;</span> Mecha</h1><span>Taller · pedidos, tandas y costos</span><span class="row" style="margin-left:auto;gap:6px"><button class="btn small" id="btnSync">Sincronizar</button><button class="btn small" id="btnResp">Respaldo</button></span></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="pedidos" aria-selected="true">Pedidos</button>
    <button role="tab" data-tab="clientes">Clientes</button>
    <button role="tab" data-tab="tandas">Tandas</button>
    <button role="tab" data-tab="inventario">Inventario</button>
    <button role="tab" data-tab="moldes">Moldes y pabilo</button>
    <button role="tab" data-tab="costeo">Costeo</button>
    <button role="tab" data-tab="compras">Compras</button>
    <button role="tab" data-tab="recetas">Mis recetas</button>
    <button role="tab" data-tab="mes">Mes a mes</button>
  </nav>
</div></header>
<main class="wrap" id="main"><p class="status">Cargando tu taller…</p></main>
<div id="layer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(() => {
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cop = new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
const $$ = n => cop.format(Math.round(+n||0));
const N = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,"");
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysUntil = s => { const d = parseD(s); return d ? Math.round((d - today())/86400000) : null; };
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtD = s => { const d = parseD(s); return d ? `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}` : "—"; };
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];

const DEFAULT_CFG = { secado:4, jornada:8, noche:false, empaque:1, aviso:3, pabS:5, pabM:7, pabL:9, densEsencia:0.95, gotasMl:20, usosMolde:50, pabPrecioS:1200, pabPrecioM:1500, pabPrecioL:1800, domicilioCosto:21000, descDesde:12, descPct:5 };
const S = { tab:"pedidos", filtro:"activos", soloEntregados:false, pedidos:[], moldes:[], fichas:[], combos:[], precios:[], recetas:[], inventario:[], clientes:[], cfg:{...DEFAULT_CFG}, loaded:{p:false,m:false,f:false,c:false}, db:null, offline:false, calc:{lines:[], inicio:ymd(today())} };

// ---------- cálculos ----------
function fichaCalc(f){
  const desgaste = moldeCost(f);
  const insumos = (f.insumos||[]).reduce((a,i)=> a + insCost(i), 0) + desgaste;
  const mo = N(f.manoObra);
  const base = insumos + mo;
  const sugerido = Math.ceil(base * (1 + N(f.gananciaPct)/100) / 500) * 500;
  const precio = N(f.precioFijo) > 0 ? N(f.precioFijo) : sugerido;
  return { insumos, desgaste, mo, base, sugerido, precio, ganancia: precio - base };
}
const ENVASES_ESENCIA = [25,120,150,250,500,1000];
const FRASCOS_COLORANTE = [10,30,60];
function insTipo(i){ return i.tipo || (/esencia|fragancia|aroma/i.test(i.nombre||"") ? "esencia" : /colorante/i.test(i.nombre||"") ? "colorante" : /pabilo|mecha/i.test(i.nombre||"") ? "pabilo" : "general"); }
const TALLAS = ["S","M","L"];
function pabPrecioMetro(t){ return N(S.cfg["pabPrecio"+(t||"M")]); }
function insRinde(i){
  const t = insTipo(i), q = N(i.compraCant);
  if(t === "esencia") return q * Math.max(0.1, N(S.cfg.densEsencia) || 0.95);
  if(t === "colorante") return q * Math.max(1, N(S.cfg.gotasMl) || 20);
  return q;
}
function insCost(i){
  if(insTipo(i) === "pabilo") return pabPrecioMetro(i.talla) / 100 * N(i.uso);
  const r = insRinde(i); return r > 0 ? N(i.compraPrecio) / r * N(i.uso) : 0;
}
function insUnidad(i){ const t = insTipo(i); return t === "esencia" ? "g" : t === "colorante" ? "gotas" : t === "pabilo" ? "cm" : (i.unidad || "und"); }
// insumos que gasta una lista de líneas {fichaId|comboId, cant}
function insumosPara(lineas){
  const acc = {};
  const sumar = (f, cant) => {
    (f.insumos||[]).forEach(i => {
      const t = insTipo(i), u = insUnidad(i);
      const nombre = t === "pabilo" ? `Pabilo ${i.talla||"M"}` : (i.nombre || "Insumo");
      const k = (nombre + "|" + u).toLowerCase();
      const r = acc[k] ||= { nombre, unidad:u, tipo:t, cantidad:0, costo:0 };
      r.cantidad += N(i.uso) * cant; r.costo += insCost(i) * cant;
    });
    const mo = f.moldeId && S.moldes.find(x=>x.id===f.moldeId);
    if(mo){ const k = ("molde " + mo.nombre).toLowerCase(); const r = acc[k] ||= { nombre:`Molde ${mo.nombre}`, unidad:"vaciados", tipo:"molde", cantidad:0, costo:0 }; r.cantidad += cant; r.costo += moldeCost(f) * cant; }
  };
  lineas.forEach(l => {
    const cant = N(l.cant); if(!cant) return;
    if(l.comboId){ const c = S.combos.find(x=>x.id===l.comboId); (c?.items||[]).forEach(ci => { const f = S.fichas.find(x=>x.id===ci.fichaId); if(f) sumar(f, cant*N(ci.cant)); }); }
    else { const f = S.fichas.find(x=>x.id===l.fichaId); if(f) sumar(f, cant); }
  });
  return Object.values(acc).sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
function fmtCant(r){
  const n = r.cantidad, f = v => (Math.round(v*10)/10).toLocaleString("es-CO");
  if(r.tipo === "esencia") return `${f(n)} g <span class="hint">≈ ${f(n/(N(S.cfg.densEsencia)||0.95))} ml</span>`;
  if(r.tipo === "colorante") return `${Math.round(n)} gotas <span class="hint">≈ ${f(n/(N(S.cfg.gotasMl)||20))} ml</span>`;
  if(r.tipo === "pabilo") return `${f(n)} cm <span class="hint">≈ ${f(n/100)} m</span>`;
  if(r.unidad === "g" && n >= 1000) return `${f(n)} g <span class="hint">≈ ${f(n/1000)} kg</span>`;
  return `${f(n)} ${esc(r.unidad)}`;
}
function tablaInsumos(lineas){
  const rows = insumosPara(lineas);
  if(!rows.length) return `<p class="hint" style="margin:0">Elige velas que tengan ficha de costeo para ver los insumos.</p>`;
  const total = rows.reduce((a,r)=>a+r.costo,0);
  return `<div class="tbl-wrap"><table><thead><tr><th>Insumo</th><th class="r">Cantidad</th><th class="r">Costo</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.nombre)}</td><td class="r num">${fmtCant(r)}</td><td class="r num">${$$(r.costo)}</td></tr>`).join("")}</tbody>
  <tfoot><tr><td>Total insumos</td><td></td><td class="r num">${$$(total)}</td></tr></tfoot></table></div>`;
}
// combos
function comboCalc(c){
  let normal=0, insumos=0, mo=0, velas=0;
  (c.items||[]).forEach(ci => { const f = S.fichas.find(x=>x.id===ci.fichaId); if(!f) return; const fc = fichaCalc(f), q = N(ci.cant); velas += q; normal += fc.precio*q; insumos += fc.insumos*q; mo += fc.mo*q; });
  const precio = N(c.precio) || normal;
  const ganancia = precio - insumos - mo, gananciaNormal = normal - insumos - mo;
  return { velas, normal, insumos, mo, precio, ganancia, gananciaNormal, minimo: insumos + mo,
    descuento: normal > 0 ? 1 - precio/normal : 0, margen: precio > 0 ? ganancia/precio : 0,
    conserva: gananciaNormal > 0 ? ganancia/gananciaNormal : 0 };
}
function moldeCost(f){ const mo = f.moldeId && S.moldes.find(x=>x.id===f.moldeId); return mo && N(mo.precio) > 0 ? N(mo.precio) / Math.max(1, N(S.cfg.usosMolde) || 50) : 0; }
function pedidoCalc(p){
  let ventas=0, insumos=0, mo=0, velas=0, sueltas=0;
  (p.items||[]).forEach(it => { const c = N(it.cant); velas += c*(N(it.velas)||1); ventas += c*N(it.precio); insumos += c*N(it.costo); mo += c*N(it.mo); if(!it.comboId) sueltas += c*N(it.precio); });
  const descAplica = velas > N(S.cfg.descDesde) && N(S.cfg.descPct) > 0;
  const descOn = descAplica && (p.descAplicar !== undefined ? !!p.descAplicar : (!p.creado || p.creado >= "2026-11-06T23:30"));
  const descuento = descOn ? Math.round(sueltas * N(S.cfg.descPct) / 100) : 0;
  ventas -= descuento;
  const envio = N(p.envio);
  const envioCosto = p.envioCosto === undefined || p.envioCosto === null || p.envioCosto === "" ? envio : N(p.envioCosto);
  const envioAsumido = Math.max(0, envioCosto - envio);
  const total = ventas + envio;
  const pagado = (p.abonos||[]).reduce((a,b)=>a+N(b.monto),0);
  return { velas, descAplica, descOn, descuento, ventas, envio, envioCosto, envioAsumido, total, insumos, mo, ganancia: ventas - insumos - mo - envioAsumido, pagado, saldo: Math.max(0, total - pagado) };
}
function pabilo(diam){
  const d = N(diam), c = S.cfg;
  if(!d) return "—";
  if(d <= N(c.pabS)) return "S";
  if(d <= N(c.pabM)) return "M";
  if(d <= N(c.pabL)) return "L";
  return "2×L";
}
function urgencia(p){
  if(p.estado === "entregado" || p.estado === "cancelado") return null;
  const d = daysUntil(p.fechaEntrega);
  if(d === null) return null;
  if(d < 0) return { cls:"bad", txt: `Atrasado ${-d} día${d===-1?"":"s"}` };
  if(d === 0) return { cls:"bad", txt: "Se entrega hoy" };
  if(d === 1) return { cls:"warn", txt: "Mañana" };
  if(d <= N(S.cfg.aviso)) return { cls:"warn", txt: `En ${d} días` };
  return { cls:"", txt: `En ${d} días` };
}

// ---------- avance de producción ----------
function tandasPorDia(){ const c = S.cfg; return Math.max(1, Math.floor(Math.max(1, N(c.jornada)||8) / Math.max(0.5, N(c.secado)||4))) + (c.noche ? 1 : 0); }
function produccion(p){
  const fig = {};
  const add = (key, nombre, cant, fichaId) => { const r = fig[key] ||= { key, nombre, necesita:0, hechas:0, moldes:null, moldeNombre:"" }; r.necesita += cant;
    const f = fichaId && S.fichas.find(x=>x.id===fichaId); const mo = f && f.moldeId && S.moldes.find(x=>x.id===f.moldeId);
    if(mo){ r.moldes = Math.max(1, N(mo.cantidad)||1); r.moldeNombre = mo.nombre; } };
  (p.items||[]).forEach(it => {
    const cant = N(it.cant); if(!cant) return;
    if(it.comboId){ const cb = S.combos.find(x=>x.id===it.comboId); (cb?.items||[]).forEach(ci => { const f = S.fichas.find(x=>x.id===ci.fichaId); if(f) add(f.id, f.nombre, cant*N(ci.cant), f.id); }); }
    else if(it.fichaId) add(it.fichaId, it.nombre, cant, it.fichaId);
    else add("x:" + (it.nombre||"Vela personalizada").trim().toLowerCase(), it.nombre || "Vela personalizada", cant, null);
  });
  const filas = Object.values(fig);
  filas.forEach(r => { r.hechas = Math.min(r.necesita, Math.max(0, N((p.hechas||{})[r.key]))); r.faltan = r.necesita - r.hechas; });
  const necesita = filas.reduce((a,r)=>a+r.necesita,0), hechas = filas.reduce((a,r)=>a+r.hechas,0), faltan = necesita - hechas;
  const pct = necesita ? Math.round(hechas/necesita*100) : 0;
  const res = { filas, necesita, hechas, faltan, pct, plan:null };
  if(!necesita) return res;
  if(!faltan){ res.plan = { cls:"ok", titulo:"Producción completa", txt:"Ya tienes todas las velas de este pedido." }; return res; }
  const d = daysUntil(p.fechaEntrega);
  if(d === null){ res.plan = { cls:"", titulo:"Sin fecha de entrega", txt:"Pon la fecha de entrega para decirte si vas a tiempo." }; return res; }
  const porDia = tandasPorDia(), emp = Math.max(0, Math.round(N(S.cfg.empaque)));
  const disponibles = d - emp + 1;
  const tandasDe = r => Math.ceil(r.faltan / (r.moldes || 1));
  const conFalta = filas.filter(r=>r.faltan>0);
  const cuello = conFalta.slice().sort((a,b)=>tandasDe(b)-tandasDe(a))[0];
  const tandas = tandasDe(cuello), diasNec = Math.ceil(tandas / porDia);
  const sinMolde = conFalta.filter(r=>!r.moldes).map(r=>r.nombre);
  const nota = sinMolde.length ? ` (${sinMolde.join(", ")} no ${sinMolde.length===1?"tiene":"tienen"} molde asignado en su ficha; conté 1 molde.)` : "";
  // ritmo real
  const log = (p.avance||[]).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let ritmo = null;
  if(log.length){ const dias = -daysUntil(log[0].fecha) + 1; if(dias >= 2) ritmo = hechas / dias; }
  res.ritmo = ritmo; res.disponibles = disponibles; res.porDiaNec = disponibles > 0 ? Math.ceil(faltan / disponibles) : faltan;
  if(disponibles <= 0){ res.plan = { cls:"bad", titulo:"Ya no queda tiempo de producción", txt:`Contando ${emp} día${emp===1?"":"s"} de empaque, la producción debía terminar antes. Habla con el cliente para mover la fecha o entregar por partes.` }; return res; }
  if(diasNec > disponibles){
    const tandasDia = Math.ceil(tandas / disponibles), horas = tandasDia * (N(S.cfg.secado)||4);
    const moldesNec = Math.ceil(cuello.faltan / (porDia * disponibles)) - (cuello.moldes || 1);
    res.plan = { cls:"bad", titulo:"Debes aumentar la producción",
      txt:`Con tu ritmo de ${porDia} tanda${porDia===1?"":"s"} al día necesitas ${diasNec} días y solo te quedan ${disponibles}. El cuello de botella es ${cuello.nombre}: te faltan ${cuello.faltan} y tienes ${cuello.moldes||1} molde${(cuello.moldes||1)===1?"":"s"}. Opciones: hacer ${tandasDia} tandas al día (unas ${horas} horas de secado)${moldesNec>0?`, o conseguir ${moldesNec} molde${moldesNec===1?"":"s"} más de ${cuello.moldeNombre||cuello.nombre}`:""}.${nota}` };
  } else if(diasNec === disponibles){
    res.plan = { cls:"warn", titulo:"Vas justo a tiempo", txt:`Necesitas ${diasNec} día${diasNec===1?"":"s"} de producción y te quedan exactamente ${disponibles}. No puedes perder ningún día; si puedes, adelanta una tanda extra.${nota}` };
  } else {
    res.plan = { cls:"ok", titulo:"Vas a tiempo", txt:`Con tus moldes terminas en ${diasNec} día${diasNec===1?"":"s"} y tienes ${disponibles}. Te sobra${disponibles-diasNec===1?"":"n"} ${disponibles-diasNec} día${disponibles-diasNec===1?"":"s"} de margen.${nota}` };
  }
  if(ritmo !== null && ritmo < res.porDiaNec && res.plan.cls !== "bad"){
    res.plan.cls = "warn"; res.plan.titulo = "Tu ritmo real va por debajo";
    res.plan.txt = `Llevas en promedio ${Math.round(ritmo*10)/10} velas al día y necesitas ${res.porDiaNec} al día para terminar a tiempo. ` + res.plan.txt;
  }
  return res;
}
function barra(pct, cls){ return `<div class="pbar"><i class="${cls||""}" style="width:${Math.min(100,pct)}%"></i></div>`; }

function orderCard(p){

  <div class="side"><span class="num" style="font-weight:600">${$$(c.total)}</span>
  <div class="bar" title="Pagado"><i style="width:${pct}%"></i></div>
  <span class="meta num">${c.saldo>0?`Saldo ${$$(c.saldo)}`:c.total>0?"Pagado":""}</span></div></div>`;
}

      <tbody>${rows.map(r=>`<tr><td>${esc(r.mo.nombre)}</td><td class="r num">${r.v}</td><td class="r num">${r.q}</td><td class="r num">${r.t}</td><td class="r num">${r.t*sec}</td></tr>`).join("")}</tbody></table></div>
      <p class="hint" style="margin:10px 0 0">Cuento que vacías todos los moldes a la vez en cada tanda, así que manda el molde con más tandas${cuello?` (${esc(cuello.mo.nombre)})`:""}.${extra>0?` Con ${extra} molde${extra===1?"":"s"} más de ese diseño te ahorras una tanda.`:""}</p></div>`;

function rMoldes(m){

function rMes(m){
  const meses = {};
  S.pedidos.forEach(p => {
    if(p.estado==="cancelado" || !p.fechaEntrega) return;
    if(S.soloEntregados && p.estado!=="entregado") return;
    const k = p.fechaEntrega.slice(0,7);
    const c = pedidoCalc(p);
    const r = meses[k] ||= {k, n:0, velas:0, ventas:0, insumos:0, mo:0, ganancia:0, pagado:0, saldo:0, dom:0};
    r.n++; r.velas+=c.velas; r.ventas+=c.total; r.insumos+=c.insumos; r.mo+=c.mo; r.ganancia+=c.ganancia; r.pagado+=c.pagado; r.saldo+=c.saldo; r.dom+=c.envioAsumido;
  });
  const rows = Object.values(meses).sort((a,b)=>b.k.localeCompare(a.k));
  const lbl = k => { const [y,mm] = k.split("-").map(Number); return `${MESES_L[mm-1]} ${y}`; };
  const last = rows.slice(0,6).reverse();
  const max = Math.max(1, ...last.map(r=>Math.max(0,r.mo)+Math.max(0,r.ganancia)));
  const cur = meses[ymd(today()).slice(0,7)];
  m.innerHTML = `
  <div class="sec-head"><div><h2>Mes a mes</h2><p class="lede">Cada pedido cuenta en el mes de su fecha de entrega. La mano de obra es lo que te pagas a ti; la ganancia es lo que queda para Magma &amp; Mecha después de insumos y mano de obra.</p></div></div>
  <div class="filters"><button class="chip" id="tgE" aria-pressed="${S.soloEntregados}">Solo pedidos entregados</button></div>
  ${!rows.length ? `<div class="empty"><strong>Todavía no hay meses que sumar</strong>Cuando registres pedidos con fecha de entrega, aquí verás cuánto ganaste por mano de obra y cuánto quedó para la empresa.</div>` : `
  <div class="stack">
  ${cur ? `<div class="result"><div class="sub">Este mes (${lbl(cur.k)})</div><div class="grid" style="margin-top:8px">
    <div><div class="sub">Tu mano de obra</div><div class="big num">${$$(cur.mo)}</div></div>
    <div><div class="sub">Ganancia empresa</div><div class="big num">${$$(cur.ganancia)}</div></div>
    <div><div class="sub">Por cobrar</div><div class="big num">${$$(cur.saldo)}</div></div></div></div>` : ""}
  <div class="panel"><h3>Últimos meses</h3>
  <div class="chart">${last.map(r=>{ const hm=Math.max(0,r.mo)/max*130, hg=Math.max(0,r.ganancia)/max*130; return `<div class="col"><div class="stk" title="${esc(lbl(r.k))}: mano de obra ${$$(r.mo)}, ganancia ${$$(r.ganancia)}"><div class="mo" style="height:${hm}px"></div><div class="ga" style="height:${hg}px"></div></div><div class="lbl">${MESES[+r.k.slice(5)-1]} ${r.k.slice(2,4)}</div></div>`}).join("")}</div>
  <div class="legend"><span><i style="background:var(--wick)"></i>Mano de obra</span><span><i style="background:var(--ember)"></i>Ganancia empresa</span></div></div>
  <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Mes</th><th class="r">Pedidos</th><th class="r">Velas</th><th class="r">Ventas</th><th class="r">Insumos</th><th class="r">Mano de obra</th><th class="r">Domicilios que asumiste</th><th class="r">Ganancia</th><th class="r">Cobrado</th><th class="r">Por cobrar</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><td style="text-transform:capitalize">${lbl(r.k)}</td><td class="r num">${r.n}</td><td class="r num">${r.velas}</td><td class="r num">${$$(r.ventas)}</td><td class="r num">${$$(r.insumos)}</td><td class="r num">${$$(r.mo)}</td><td class="r num">${$$(r.dom)}</td><td class="r num">${$$(r.ganancia)}</td><td class="r num">${$$(r.pagado)}</td><td class="r num">${$$(r.saldo)}</td></tr>`).join("")}</tbody></table></div>
  <p class="hint" style="margin:10px 0 0">Las ventas incluyen lo que cobras de domicilio. La ganancia ya descuenta los domicilios que asumiste tú.</p></div></div>`}`;
  $("#tgE").onclick = () => { S.soloEntregados = !S.soloEntregados; render(); };
}

// ---------- drawers ----------
function drawer(title, inner, onMount){
  const L = $("#layer");
  L.innerHTML = `<div class="overlay" id="ov"><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh"><h2>${esc(title)}</h2><button class="x" id="dClose" aria-label="Cerrar">×</button></div>${inner}</div></div>`;
  const close = () => { L.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("#dClose").onclick = close;
  $("#ov").onclick = e => { if(e.target.id==="ov") close(); };
  onMount(L.querySelector(".drawer"), close);
  const f = L.querySelector("input,select"); if(f) f.focus();
}
function confirmDelete(btn, fn){
  if(btn.dataset.armed){ fn(); return; }
  btn.dataset.armed = "1"; const orig = btn.textContent; btn.textContent = "Toca otra vez para confirmar";
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = orig; } }, 3500);
}

        <label for="aM${i}">Monto<input id="aM${i}" type="number" min="0" step="1000" data-i="${i}" data-k="monto" value="${N(a.monto)}"></label>
        <button class="x" data-da="${i}" aria-label="Quitar abono">×</button></div>`).join("") || `<p class="hint">Sin abonos todavía.</p>`;
      $("#pAbo",d).querySelectorAll("[data-k]").forEach(el => el.oninput = () => { p.abonos[+el.dataset.i][el.dataset.k] = el.dataset.k==="monto" ? N(el.value) : el.value; sum(); });
      $("#pAbo",d).querySelectorAll("[data-da]").forEach(b => b.onclick = () => { p.abonos.splice(+b.dataset.da,1); drawAbonos(); });
      sum();
    };
    const domicilio = (cambioModo) => {
      const modo = $("#pEM",d).value, ec = $("#pEC",d), ev = $("#pEnv",d);
      p.envioModo = modo;
      ec.disabled = modo === "sin"; ev.disabled = modo !== "parcial";
      if(modo === "sin"){ ev.value = 0; ec.value = 0; }
      else if(modo === "cliente") ev.value = N(ec.value);
      else if(modo === "yo") ev.value = 0;
      else if(cambioModo && modo === "parcial" && !N(ev.value)) ev.value = Math.max(0, N(ec.value) - 10000);
      if(cambioModo && modo !== "sin" && !N(ec.value)) { ec.value = N(S.cfg.domicilioCosto); if(modo === "cliente") ev.value = ec.value; }
      p.envio = N(ev.value); p.envioCosto = N(ec.value);
      const velas = pedidoCalc(p).velas;
      const pol = velas >= 100 ? "envío sin costo" : velas >= 50 ? "bono de $15.000" : velas >= 30 ? "bono de $10.000" : "";
      $("#pEH",d).textContent = (pol ? `Con ${velas} velas, tu política da ${pol}. ` : "") + (modo === "yo" || modo === "parcial" ? `Tú pones ${$$(Math.max(0, p.envioCosto - p.envio))}, que se descuenta de la ganancia.` : modo === "cliente" ? "El cliente paga el domicilio completo; no afecta tu ganancia." : "");
    };
    const sum = () => {
      domicilio(false);
      const c = pedidoCalc(p);
      $("#pDW",d).hidden = !c.descAplica; $("#pDA",d).checked = c.descOn;
      $("#pDT",d).textContent = `Descuento por cantidad: ${N(S.cfg.descPct)}% por llevar más de ${N(S.cfg.descDesde)} velas${p.items.some(i=>i.comboId) ? " (no se aplica a los combos, que ya tienen su precio especial)" : ""}`;
      $("#pIns",d).innerHTML = tablaInsumos(p.items); drawProd();
      $("#pSum",d).innerHTML = `<dl class="kv"><dt>${c.velas} velas</dt><dd class="num">${$$(c.ventas + c.descuento)}</dd>${c.descuento?`<dt>Descuento por cantidad (${N(S.cfg.descPct)}%)</dt><dd class="num" style="color:var(--ember)">−${$$(c.descuento)}</dd>`:""}<dt>Domicilio cobrado</dt><dd class="num">${$$(c.envio)}</dd>
      <dt class="total">Total</dt><dd class="total num">${$$(c.total)}</dd><dt>Pagado</dt><dd class="num">${$$(c.pagado)}</dd>
      <dt class="total">Saldo</dt><dd class="total num" style="color:${c.saldo>0?"var(--ember)":"var(--ok)"}">${$$(c.saldo)}</dd>
      <dt>Tu mano de obra</dt><dd class="num">${$$(c.mo)}</dd>${c.envioAsumido?`<dt>Domicilio que asumes</dt><dd class="num" style="color:var(--bad)">−${$$(c.envioAsumido)}</dd>`:""}<dt>Ganancia empresa</dt><dd class="num" style="color:${c.ganancia<0?"var(--bad)":"inherit"}">${$$(c.ganancia)}</dd></dl>`;
    };
    $("#pEnv",d).oninput = sum; $("#pEC",d).oninput = sum;
    $("#pEM",d).onchange = () => { domicilio(true); sum(); };
    $("#pDA",d).onchange = () => { p.descAplicar = $("#pDA",d).checked; sum(); };
    const leerForm = () => { p.cliente = $("#pCli",d).value.trim(); p.telefono = $("#pTel",d).value.trim(); p.fechaEntrega = $("#pFe",d).value; p.estado = $("#pEs",d).value; p.notas = $("#pNot",d).value; };
    const guardarAvance = debounce(async () => {
      if(isNew && !S.pedidos.some(x=>x.id===p.id)) return;
      leerForm(); const { id, ...body } = p; await saveDoc("pedidos", id, body, true);
    }, 700);
    const drawProd = () => {
      const pr = produccion(p);
      $("#pProdW",d).hidden = !pr.necesita;
      if(!pr.necesita) return;
      $("#pProdS",d).textContent = `${pr.hechas} de ${pr.necesita} · ${pr.pct}% hecho · falta ${100-pr.pct}%`;
      $("#pProd",d).innerHTML = pr.filas.map((r,i)=>`<div class="line" style="grid-template-columns:1fr auto;gap:6px 10px">
        <div style="min-width:0"><b>${esc(r.nombre)}</b> <span class="hint">${r.hechas} de ${r.necesita}${r.moldes?` · ${r.moldes} molde${r.moldes===1?"":"s"}`:""}</span>${barra(Math.round(r.hechas/r.necesita*100), r.faltan? "" : "ok")}</div>
        <div class="row" style="gap:4px;flex-wrap:nowrap">
          <button class="btn small" data-pk="${i}" data-dv="-1" aria-label="Quitar una">−1</button>
          <input type="number" min="0" max="${r.necesita}" value="${r.hechas}" data-pi="${i}" aria-label="Hechas de ${esc(r.nombre)}" style="width:62px;text-align:center">
          <button class="btn small" data-pk="${i}" data-dv="1">+1</button>
          ${r.moldes && r.moldes > 1 ? `<button class="btn small" data-pk="${i}" data-dv="${r.moldes}" title="Suma una tanda completa">+${r.moldes}</button>` : ""}
        </div></div>`).join("");
      const plan = pr.plan;
      $("#pPlan",d).innerHTML = `${barra(pr.pct, plan?plan.cls:"")}<div class="row" style="justify-content:space-between;margin-top:4px"><span class="hint">Avance ${pr.pct}% · ${pr.hechas} velas</span><span class="hint">Faltan ${pr.faltan} · ${100-pr.pct}%</span></div>
        ${plan ? `<div class="alert ${plan.cls==="ok"?"ok":plan.cls}" style="margin-top:10px;flex-direction:column;align-items:flex-start;gap:4px"><b>${esc(plan.titulo)}</b><span>${esc(plan.txt)}</span>${pr.faltan && pr.disponibles>0?`<span>Necesitas unas ${pr.porDiaNec} velas al día.${pr.ritmo!==null?` Tu ritmo real: ${Math.round(pr.ritmo*10)/10} al día.`:""}</span>`:""}</div>` : ""}`;
      const set = (i, v) => {
        const r = pr.filas[i]; p.hechas = p.hechas || {};
        const nv = Math.max(0, Math.min(r.necesita, Math.round(v))), delta = nv - r.hechas;
        p.hechas[r.key] = nv;
        if(delta && !r.key.startsWith("x:") && S.pedidos.some(x=>x.id===p.id)) descontarInventario(r.key, delta, `Producción · ${$("#pCli",d).value.trim() || "pedido"}`);
        const tot = produccion(p);
        const hoy = ymd(today()); p.avance = (p.avance||[]).filter(a=>a.fecha!==hoy); p.avance.push({ fecha:hoy, total:tot.hechas });
        const es = $("#pEs",d);
        if(tot.hechas > 0 && es.value === "pendiente") es.value = "produccion";
        if(!tot.faltan && (es.value === "pendiente" || es.value === "produccion")){ es.value = "listo"; toast("¡Producción completa! Lo marqué como listo para entregar."); }
        drawProd(); guardarAvance();
      };
      $("#pProd",d).querySelectorAll("[data-pk]").forEach(b => b.onclick = () => { const i = +b.dataset.pk; set(i, pr.filas[i].hechas + N(b.dataset.dv)); });
      $("#pProd",d).querySelectorAll("[data-pi]").forEach(inp => inp.onchange = () => set(+inp.dataset.pi, N(inp.value)));
    };
    $("#pFe",d).addEventListener("change", drawProd);
    $("#pCli",d).addEventListener("change", () => { const c = listaClientes().find(x=>x.nombre.toLowerCase()===$("#pCli",d).value.trim().toLowerCase()); if(c && c.telefono && !$("#pTel",d).value.trim()) $("#pTel",d).value = c.telefono; });
    d.querySelectorAll("[data-msg]").forEach(b => b.onclick = () => { leerForm(); panelMensaje($("#pMsg",d), b.dataset.msg, p); });
    $("#pAddI",d).onclick = () => { p.items.push(S.fichas[0] ? itemFromFicha(S.fichas[0],1) : {fichaId:"",nombre:"Vela personalizada",cant:1,precio:0,costo:0,mo:0}); drawItems(); };
    $("#pAddA",d).onclick = () => { p.abonos.push({fecha:ymd(today()), monto:0}); drawAbonos(); };
    $("#pSave",d).onclick = async () => {
      leerForm();
      if(!p.cliente){ $("#pCli",d).focus(); toast("Escribe el nombre del cliente"); return; }
      p.items = p.items.filter(i=>N(i.cant)>0);
      if(!p.creado) p.creado = new Date().toISOString();
      const { id, ...body } = p;
      if(await saveDoc("pedidos", id, body)){ asegurarCliente(p.cliente, p.telefono); close(); toast("Pedido guardado"); }
    };
    $("#pDel",d).onclick = e => confirmDelete(e.target, async () => { if(await delDoc("pedidos", p.id)){ close(); toast("Pedido borrado"); } });
    drawItems(); drawAbonos();
  });
}
function itemFromFicha(f, cant){ const c = fichaCalc(f); return { fichaId:f.id, nombre:f.nombre, cant:N(cant)||1, precio:c.precio, costo:c.insumos, mo:c.mo }; }
function itemFromCombo(cb, cant){ const c = comboCalc(cb); return { comboId:cb.id, fichaId:"", nombre:cb.nombre, cant:N(cant)||1, velas:c.velas, precio:c.precio, costo:c.insumos, mo:c.mo }; }

function editMolde(m0){
  const isNew = !m0;
  const mo = { ...(m0 || { id:uid(), nombre:"", diametro:"", cantidad:1, gramos:"", pabiloFijo:"", notas:"" }) };
  drawer(isNew ? "Nuevo molde" : "Molde", `
    <label for="mN">Nombre del molde<input id="mN" value="${esc(mo.nombre)}" placeholder="Ej. Calabaza mediana"></label>
    <div class="grid"><label for="mD">Diámetro más ancho (cm)<input id="mD" type="number" step="0.1" min="0" value="${esc(mo.diametro)}"></label>
    <label for="mC">Unidades que tienes<input id="mC" type="number" min="1" value="${N(mo.cantidad)||1}"></label>
    <label for="mG">Cera por vela (g)<input id="mG" type="number" min="0" value="${esc(mo.gramos)}"></label>
    <label for="mPr">Precio del molde ($)<input id="mPr" type="number" min="0" step="1000" value="${N(mo.precio)||""}"></label></div>
    <p class="hint" id="mDes" style="margin:0"></p>
    <div class="panel row" id="mSug" style="justify-content:space-between"></div>
    <label for="mP">Pabilo probado (opcional)<select id="mP"><option value="">Usar el sugerido</option>${["S","M","L","2×L","2×M"].map(t=>`<option ${mo.pabiloFijo===t?"selected":""}>${t}</option>`).join("")}</select></label>
    <label for="mNo">Notas de quemado<textarea id="mNo" rows="2" placeholder="Ej. con L hizo túnel; con M quemó parejo">${esc(mo.notas)}</textarea></label>
    <div class="row" style="justify-content:space-between"><button class="btn danger" id="mDel" ${isNew?"hidden":""}>Borrar</button><button class="btn primary" id="mSave">Guardar molde</button></div>`,
  (d, close) => {
    const sug = () => { const t = pabilo($("#mD",d).value); $("#mSug",d).innerHTML = `<span>Pabilo sugerido para ${N($("#mD",d).value)||"—"} cm</span><span class="wick">${t}</span>`; };
    $("#mD",d).oninput = sug; sug();
    const des = () => { const p = N($("#mPr",d).value), u = Math.max(1, N(S.cfg.usosMolde)||50); $("#mDes",d).textContent = p ? `Desgaste por vela: ${$$(p/u)} (precio ÷ ${u} usos). Se suma solo en las fichas que usan este molde.` : "Con el precio del molde calculo cuánto se desgasta en cada vela."; };
    $("#mPr",d).oninput = des; des();
    $("#mSave",d).onclick = async () => {
      const body = { nombre:$("#mN",d).value.trim(), diametro:N($("#mD",d).value), cantidad:Math.max(1,Math.round(N($("#mC",d).value))), gramos:N($("#mG",d).value), precio:N($("#mPr",d).value), pabiloFijo:$("#mP",d).value, notas:$("#mNo",d).value };
      if(!body.nombre){ $("#mN",d).focus(); toast("Ponle nombre al molde"); return; }
      if(await saveDoc("moldes", mo.id, body)){ close(); toast("Molde guardado"); }
    };
    $("#mDel",d).onclick = e => confirmDelete(e.target, async () => { if(await delDoc("moldes", mo.id)){ close(); toast("Molde borrado"); } });
  });
}

function editFicha(f0){
  const isNew = !f0;
  const f = JSON.parse(JSON.stringify(f0 || { id:uid(), nombre:"", moldeId:"", insumos:[
    {nombre:"Cera de soya", compraCant:1000, compraPrecio:0, uso:0, unidad:"g"},
    {nombre:"Esencia", tipo:"esencia", compraCant:120, compraPrecio:0, uso:0, unidad:"g"},
    {nombre:"Colorante", tipo:"colorante", compraCant:10, compraPrecio:0, uso:0, unidad:"gotas"},
    {nombre:"Pabilo", tipo:"pabilo", talla:"M", compraCant:100, compraPrecio:0, uso:0, unidad:"cm"},
    {nombre:"Pegatina", compraCant:1, compraPrecio:0, uso:1, unidad:"und"},
    {nombre:"Bolsa", compraCant:1, compraPrecio:0, uso:1, unidad:"und"}], manoObra:0, gananciaPct:30, precioFijo:0 }));
  f.insumos.forEach(i => {
    const t = insTipo(i); i.tipo = t;
    if(t === "esencia"){ if(!ENVASES_ESENCIA.includes(N(i.compraCant))) i.compraCant = 120; i.unidad = "g"; }
    if(t === "colorante"){ if(!FRASCOS_COLORANTE.includes(N(i.compraCant))) i.compraCant = 10; i.unidad = "gotas"; }
    if(t === "pabilo"){ if(!TALLAS.includes(i.talla)){ const mo = f.moldeId && S.moldes.find(x=>x.id===f.moldeId); const sug = mo ? (mo.pabiloFijo || pabilo(mo.diametro)) : "M"; i.talla = TALLAS.includes(sug) ? sug : "M"; } if(i.unidad !== "cm"){ i.uso = 0; } i.unidad = "cm"; i.compraCant = 100; }
  });
  drawer(isNew ? "Nueva ficha" : "Ficha de costeo", `
    <div class="grid"><label for="fN">Vela<input id="fN" value="${esc(f.nombre)}" placeholder="Ej. Calabaza Halloween"></label>
    <label for="fM">Molde<select id="fM"><option value="">— Sin molde —</option>${S.moldes.map(m=>`<option value="${esc(m.id)}" ${m.id===f.moldeId?"selected":""}>${esc(m.nombre)}</option>`).join("")}</select></label></div>
    <div><h3>Insumos por vela</h3><p class="hint" style="margin:0 0 8px">Pon cuánto trae lo que compras, cuánto pagaste y cuánto gasta una vela. Ej. cera: compré 1000 g por $25.000, uso 180 g. La esencia la eliges por envase y la pones en gramos; el colorante, por frasco y en gotas.</p>
    <div class="lines" id="fIns"></div><div class="line" id="fMol" style="margin-top:8px"></div>
    <div class="row" style="margin-top:8px"><button class="btn small" id="fAdd">+ Agregar insumo</button><button class="btn small" id="fAddE">+ Esencia</button><button class="btn small" id="fAddC">+ Colorante</button><button class="btn small" id="fAddP">+ Pabilo</button></div></div>
    <div class="grid"><label for="fMO">Tu mano de obra por vela<input id="fMO" type="number" min="0" step="100" value="${N(f.manoObra)}"></label>
    <label for="fG">Ganancia empresa (%)<input id="fG" type="number" min="0" step="1" value="${N(f.gananciaPct)}"></label>
    <label for="fP">Precio fijo (opcional)<input id="fP" type="number" min="0" step="500" value="${N(f.precioFijo)||""}" placeholder="Usar el sugerido"></label></div>
    <div class="panel" id="fSum"></div>
    <div class="row" style="justify-content:space-between"><button class="btn danger" id="fDel" ${isNew?"hidden":""}>Borrar</button><button class="btn primary" id="fSave">Guardar ficha</button></div>`,
  (d, close) => {
    const draw = () => {
      const rindeTxt = i => { const t = insTipo(i), r = insRinde(i); return t === "esencia" ? `El envase rinde unos ${Math.round(r)} g` : t === "colorante" ? `El frasco rinde unas ${Math.round(r)} gotas` : ""; };
      $("#fIns",d).innerHTML = f.insumos.map((i,k)=>{ const t = insTipo(i);
        const compra = t === "esencia" ? `<label for="q${k}">Envase<select id="q${k}" data-k="${k}" data-f="compraCant">${ENVASES_ESENCIA.map(v=>`<option value="${v}" ${N(i.compraCant)===v?"selected":""}>${v===1000?"1 litro":v+" ml"}</option>`).join("")}</select></label>`
          : t === "colorante" ? `<label for="q${k}">Frasco<select id="q${k}" data-k="${k}" data-f="compraCant">${FRASCOS_COLORANTE.map(v=>`<option value="${v}" ${N(i.compraCant)===v?"selected":""}>${v} ml</option>`).join("")}</select></label>`
          : `<label for="q${k}">Compré<input id="q${k}" type="number" min="0" data-k="${k}" data-f="compraCant" value="${N(i.compraCant)}"></label>`;
        const uLbl = t === "esencia" ? "Uso (g)" : t === "colorante" ? "Uso (gotas)" : t === "pabilo" ? "Uso (cm)" : `Uso (${esc(i.unidad||"und")})`;
        if(t === "pabilo") return `<div class="line ins">
        <label class="ins-name" for="n${k}">Insumo<input id="n${k}" data-k="${k}" data-f="nombre" value="${esc(i.nombre)}"></label>
        <label for="q${k}">Tamaño<select id="q${k}" data-k="${k}" data-f="talla">${TALLAS.map(v=>`<option value="${v}" ${i.talla===v?"selected":""}>${v}</option>`).join("")}</select></label>
        <label>Metro<input value="${$$(pabPrecioMetro(i.talla))}" disabled id="pm${k}"></label>
        <label for="u${k}">Uso (cm)<input id="u${k}" type="number" min="0" step="0.5" data-k="${k}" data-f="uso" value="${N(i.uso)}"></label>
        <div class="cost" id="c${k}">${$$(insCost(i))}</div>
        <button class="x" data-dk="${k}" aria-label="Quitar insumo">×</button>
        <p class="hint" style="grid-column:1/-1;margin:0">El precio del metro por tamaño se cambia en Costeo → Conversiones.</p></div>`;
        return `<div class="line ins">
        <label class="ins-name" for="n${k}">Insumo<input id="n${k}" data-k="${k}" data-f="nombre" value="${esc(i.nombre)}"></label>
        ${compra}
        <label for="p${k}">Pagué $<input id="p${k}" type="number" min="0" step="100" data-k="${k}" data-f="compraPrecio" value="${N(i.compraPrecio)}"></label>
        <label for="u${k}">${uLbl}<input id="u${k}" type="number" min="0" step="any" data-k="${k}" data-f="uso" value="${N(i.uso)}"></label>
        <div class="cost" id="c${k}">${$$(insCost(i))}</div>
        <button class="x" data-dk="${k}" aria-label="Quitar insumo">×</button>
        ${t !== "general" ? `<p class="hint" id="r${k}" style="grid-column:1/-1;margin:0">${rindeTxt(i)}</p>` : ""}</div>`; }).join("");
      $("#fIns",d).querySelectorAll("[data-f]").forEach(el => el.oninput = el.onchange = () => { const i = f.insumos[+el.dataset.k]; i[el.dataset.f] = (el.dataset.f==="nombre" || el.dataset.f==="talla") ? el.value : N(el.value); $("#c"+el.dataset.k,d).textContent = $$(insCost(i)); const pm = $("#pm"+el.dataset.k,d); if(pm) pm.value = $$(pabPrecioMetro(i.talla)); const r = $("#r"+el.dataset.k,d); if(r) r.textContent = rindeTxt(i); sum(); });
      drawMolde();

      el.hidden = !mo;

        : `<div><b>Desgaste del molde</b><div class="hint">Pon el precio de «${esc(mo.nombre)}» en Moldes y pabilo para sumarlo aquí.</div></div><div class="cost">${$$(0)}</div>`;

    const sum = () => {
      f.manoObra = N($("#fMO",d).value); f.gananciaPct = N($("#fG",d).value); f.precioFijo = N($("#fP",d).value);
      const c = fichaCalc(f);
      $("#fSum",d).innerHTML = `<dl class="kv"><dt>Insumos${c.desgaste?" + molde":""}</dt><dd class="num">${$$(c.insumos)}</dd><dt>Mano de obra</dt><dd class="num">${$$(c.mo)}</dd>
      <dt>Costo total</dt><dd class="num">${$$(c.base)}</dd><dt>Precio sugerido (redondeado a $500)</dt><dd class="num">${$$(c.sugerido)}</dd>
      <dt class="total">Precio de venta</dt><dd class="total num">${$$(c.precio)}</dd>
      <dt>Ganancia empresa por vela</dt><dd class="num" style="color:${c.ganancia<0?"var(--bad)":"var(--ok)"}">${$$(c.ganancia)}${c.precio>0?` (${Math.round(c.ganancia/c.precio*100)}% del precio)`:""}</dd></dl>
      ${c.ganancia<0?`<p class="hint" style="color:var(--bad);margin:8px 0 0">Con ese precio fijo pierdes plata en cada vela.</p>`:""}`;
    };
    ["fMO","fG","fP"].forEach(id => $("#"+id,d).oninput = sum);

// ---------- utilidades comunes ----------
const fmtNum = v => (Math.round(N(v)*10)/10).toLocaleString("es-CO");
const norm = t => String(t||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function irTab(t){ S.tab = t; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab===t)); try{ localStorage.setItem("mm-tab", t); }catch(e){} render(); window.scrollTo(0,0); const b = document.querySelector(`#tabs [data-tab="${t}"]`); if(b && b.scrollIntoView) b.scrollIntoView({block:"nearest", inline:"center"}); }
// conversión entre unidades (usa densidad de esencia y gotas por ml)
const DIM = { g:["masa",1], kg:["masa",1000], ml:["vol",1], l:["vol",1000], gotas:["vol",0], cm:["len",1], m:["len",100], und:["und",1] };
function convertir(cant, de, a){
  if(de === a) return cant;
  const gm = N(S.cfg.gotasMl)||20, dens = N(S.cfg.densEsencia)||0.95;
  const f = u => u === "gotas" ? 1/gm : (DIM[u]||["und",1])[1];
  const A = DIM[de], B = DIM[a]; if(!A || !B) return null;
  let base = cant * f(de);
  if(A[0] === B[0]) return base / f(a);
  if(A[0] === "masa" && B[0] === "vol") return (base / dens) / f(a);
  if(A[0] === "vol" && B[0] === "masa") return (base * dens) / f(a);
  return null;
}

// ---------- inventario ----------
function invItem(nombre){ const n = norm(nombre); return S.inventario.find(i => norm(i.nombre) === n); }
function comprometido(){
  // insumos que faltan por gastar en los pedidos activos (según lo que falta producir)
  const lineas = [];
  S.pedidos.filter(p => !["entregado","cancelado"].includes(p.estado)).forEach(p => produccion(p).filas.forEach(r => { if(r.faltan > 0 && !r.key.startsWith("x:")) lineas.push({ fichaId:r.key, cant:r.faltan }); }));
  const out = {};
  insumosPara(lineas).filter(r=>r.tipo!=="molde").forEach(r => { out[norm(r.nombre)] = r; });
  return out;
}
function invEstado(i, comp){
  const stock = N(i.cantidad), min = N(i.minimo);
  let usar = 0;
  if(comp){ const c = comp[norm(i.nombre)]; if(c){ const v = convertir(c.cantidad, c.unidad, i.unidad); if(v !== null) usar = v; } }
  const queda = stock - usar;
  if(!(i.movimientos||[]).length && !stock) return { cls:"", txt:"Sin contar", usar, queda, sinContar:true };
  if(stock <= 0) return { cls:"bad", txt:"Agotado", usar, queda };
  if(queda < 0) return { cls:"bad", txt:"No alcanza", usar, queda };
  if(min && queda < min) return { cls:"warn", txt:"Bajo", usar, queda };
  return { cls:"ok", txt:"Bien", usar, queda };
}
function mejorProveedor(nombre, cant, unidad){
  const n = norm(nombre);
  const op = S.precios.filter(r => norm(r.insumo) === n || norm(r.insumo).includes(n) || n.includes(norm(r.insumo))).map(r => {
    const pu = precioUnit(r); if(!pu) return null;
    const q = convertir(cant, unidad, pu.base); if(q === null) return null;
    return { proveedor:r.proveedor || "—", costo:q * pu.porBase, presentacion:`${fmtNum(r.cantidad)} ${r.unidad}` };
  }).filter(Boolean).sort((a,b)=>a.costo-b.costo);
  return op[0] || null;
}
async function guardarInv(item, nueva, motivo){
  const { id, ...body } = item;
  nueva = Math.max(0, nueva);
  body.cantidad = Math.round(nueva*100)/100;
  body.actualizado = new Date().toISOString();
  const mov = { fecha:ymd(today()), delta:Math.round((nueva - N(item.cantidad))*100)/100, motivo:motivo||"" };
  body.movimientos = [mov, ...(item.movimientos||[])].slice(0, 25);
  return saveDoc("inventario", id, body, true);
}
function descontarInventario(fichaId, delta, motivo){
  const rows = insumosPara([{ fichaId, cant:Math.abs(delta) }]).filter(r=>r.tipo!=="molde");
  rows.forEach(r => {
    const it = invItem(r.nombre); if(!it) return;
    const q = convertir(r.cantidad, r.unidad, it.unidad); if(q === null || !q) return;
    const actual = S.inventario.find(x=>x.id===it.id) || it;
    guardarInv(actual, N(actual.cantidad) - Math.sign(delta) * q, (delta>0?"":"Corrección · ") + motivo);
  });
}
function insumosConocidos(){
  const out = {};
  S.fichas.forEach(f => (f.insumos||[]).forEach(i => {
    const t = insTipo(i);
    const nombre = t === "pabilo" ? `Pabilo ${i.talla||"M"}` : (i.nombre||"").trim(); if(!nombre) return;
    const unidad = t === "esencia" ? "ml" : t === "colorante" ? "ml" : t === "pabilo" ? "m" : (i.unidad === "g" ? "g" : (i.unidad||"und"));
    out[norm(nombre)] ||= { nombre, unidad };
  }));
  return Object.values(out);
}

// ---------- clientes y mensajes ----------
const telDig = t => String(t||"").replace(/\D/g,"");
const claveCliente = (nombre, tel) => { const t = telDig(tel); return t.length >= 7 ? "t" + t.slice(-10) : "n" + norm(nombre).replace(/\s+/g," "); };
function listaClientes(){
  const map = {};
  S.clientes.forEach(c => { map[claveCliente(c.nombre, c.telefono)] = { ...c, pedidos:[], doc:true }; });
  S.pedidos.forEach(p => {
    if(!p.cliente) return;
    const k = claveCliente(p.cliente, p.telefono);
    let c = map[k];
    if(!c && telDig(p.telefono).length < 7){ c = Object.values(map).find(x => norm(x.nombre) === norm(p.cliente)); }
    if(!c) c = map[k] = { id:null, nombre:p.cliente, telefono:p.telefono, pedidos:[], doc:false };
    if(!c.telefono && p.telefono) c.telefono = p.telefono;
    c.pedidos.push(p);
  });
  return Object.values(map).map(c => {
    const vivos = c.pedidos.filter(p=>p.estado!=="cancelado");
    c.gastado = vivos.reduce((a,p)=>a+pedidoCalc(p).total,0);
    c.saldo = vivos.reduce((a,p)=>a+pedidoCalc(p).saldo,0);
    c.velas = vivos.reduce((a,p)=>a+pedidoCalc(p).velas,0);
    c.ultimo = vivos.map(p=>p.fechaEntrega||(p.creado||"").slice(0,10)).sort().pop() || "";
    c.n = vivos.length;
    return c;
  }).sort((a,b)=>(b.ultimo||"").localeCompare(a.ultimo||"") || a.nombre.localeCompare(b.nombre));
}
function asegurarCliente(nombre, tel){
  if(!nombre) return;
  const k = claveCliente(nombre, tel);
  const ex = S.clientes.find(c => claveCliente(c.nombre, c.telefono) === k || (telDig(tel).length < 7 && norm(c.nombre) === norm(nombre)));
  if(ex){ if(!ex.telefono && tel){ const { id, ...b } = ex; b.telefono = tel; saveDoc("clientes", id, b, true); } return; }
  saveDoc("clientes", uid(), { nombre, telefono:tel||"", direccion:"", cumple:"", notas:"" }, true);
}

function plantilla(k){ const p = (S.cfg.plantillas||{})[k]; return p || PLANTILLAS_BASE[k].texto; }
function llenarMensaje(texto, p){
  const c = pedidoCalc(p);
  const detalle = (p.items||[]).filter(i=>N(i.cant)>0).map(i=>`• ${N(i.cant)} ${i.nombre}${i.comboId?" (combo)":""} — ${$$(N(i.cant)*N(i.precio))}`).join("\n") || "• (sin velas)";
  const nombre = (p.cliente||"").trim().split(/\s+/)[0] || "";
  const vals = { cliente:nombre, detalle, total:$$(c.total), abonado:$$(c.pagado), saldo:$$(c.saldo), mitad:$$(Math.ceil(c.total/2/1000)*1000),
    fecha: p.fechaEntrega ? fmtD(p.fechaEntrega) : "fecha por definir",
    descuento: c.descuento ? `Descuento por cantidad: −${$$(c.descuento)}\n` : "",
    domicilio: c.envio ? `Domicilio: ${$$(c.envio)}\n` : (p.envioModo==="yo" ? "Domicilio: ¡gratis!\n" : "") };
  return texto.replace(/\{(\w+)\}/g, (m0,k) => k in vals ? vals[k] : m0).replace(/\n{3,}/g,"\n\n");
}
function waLink(tel, texto){ let t = telDig(tel); if(t.length === 10 && t.startsWith("3")) t = "57" + t; return `https://wa.me/${t}?text=${encodeURIComponent(texto)}`; }
function copiar(texto){
  const ok = () => toast("Copiado. Pégalo en WhatsApp.");
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok).catch(() => fallback());
  else fallback();
  function fallback(){ const ta = document.createElement("textarea"); ta.value = texto; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ toast("No pude copiar; selecciona el texto a mano."); } ta.remove(); }
}
function panelMensaje(cont, k, p){

  const ta = cont.querySelector("#msgT"), w = cont.querySelector("#msgW");
  ta.oninput = () => { if(w) w.href = waLink(p.telefono, ta.value); };

}

function editReceta(r0, tipo){
  const isNew = !r0, esColor = tipo === "color";
  const r = JSON.parse(JSON.stringify(r0 || (esColor
    ? { id:uid(), tipo, nombre:"", muestra:"#c2410c", base:100, componentes:[{nombre:"", gotas:1}], notas:"" }
    : { id:uid(), tipo, nombre:"", unidad:"g", carga:8, componentes:[{nombre:"", pct:50},{nombre:"", pct:50}], notas:"" })));
  const sugeridos = [...new Set([
    ...S.fichas.flatMap(f=>(f.insumos||[]).filter(i=>insTipo(i)===(esColor?"colorante":"esencia")).map(i=>i.nombre)),
    ...S.recetas.filter(x=>x.tipo===tipo).flatMap(x=>(x.componentes||[]).map(c=>c.nombre)),
    ...S.precios.map(x=>x.insumo).filter(n=>esColor ? /color/i.test(n) : /esencia|fragancia|aroma/i.test(n))
  ].filter(Boolean))];
  const f1 = v => (Math.round(v*10)/10).toLocaleString("es-CO");

    ${esColor ? `<label for="rM">Color de muestra<input id="rM" type="color" value="${esc(r.muestra||"#c2410c")}" style="height:40px;padding:3px"></label>
      <label for="rB">Por cada (g de cera)<input id="rB" type="number" min="1" step="any" value="${N(r.base)||100}"></label>`
    : `<label for="rU">Mido en<select id="rU"><option value="g" ${r.unidad==="g"?"selected":""}>gramos</option><option value="ml" ${r.unidad==="ml"?"selected":""}>mililitros</option></select></label>

    <div id="rT"></div>
    <div class="panel stack"><h3 style="margin:0">Calcular</h3>
      ${esColor ? `<label for="rQ">¿Cuánta cera vas a teñir? (g)<input id="rQ" type="number" min="0" step="any" value="${N(r.base)*5||500}"></label>`
      : `<div class="grid"><label for="rQ">Quiero preparar (<span class="uLbl">${esc(r.unidad)}</span>)<input id="rQ" type="number" min="0" step="any" value="100"></label>
         <label for="rW">…o aromatizar esta cera (g)<input id="rW" type="number" min="0" step="any" placeholder="Ej. 1500"></label></div>`}
      <div id="rR"></div></div>
    <label for="rNo">Notas<textarea id="rNo" rows="2" placeholder="${esColor?"Ej. queda más oscuro al secar":"Ej. curar 48 h antes de vender"}">${esc(r.notas)}</textarea></label>
    <div class="row" style="justify-content:space-between"><button class="btn danger" id="rD" ${isNew?"hidden":""}>Borrar</button><button class="btn primary" id="rG">Guardar</button></div>`,
  (d, close) => {
    const draw = () => {
      $("#rL",d).innerHTML = r.componentes.map((c,i)=>`<div class="line calc">
        <label for="rcN${i}">${esColor?"Colorante":"Esencia"}<input id="rcN${i}" list="dlR" data-i="${i}" data-k="nombre" value="${esc(c.nombre)}"></label>
        <label for="rcV${i}">${esColor?"Gotas":"%"}<input id="rcV${i}" type="number" min="0" step="${esColor?"0.5":"any"}" data-i="${i}" data-k="${esColor?"gotas":"pct"}" value="${N(esColor?c.gotas:c.pct)}"></label>
        <button class="x" data-di="${i}" aria-label="Quitar">×</button></div>`).join("");
      $("#rL",d).querySelectorAll("[data-k]").forEach(el => el.oninput = () => { r.componentes[+el.dataset.i][el.dataset.k] = el.dataset.k==="nombre" ? el.value : N(el.value); calc(); });
      $("#rL",d).querySelectorAll("[data-di]").forEach(b => b.onclick = () => { r.componentes.splice(+b.dataset.di,1); draw(); });
      calc();
    };
    const calc = () => {
      const comps = r.componentes.filter(c=>c.nombre || N(esColor?c.gotas:c.pct));
      if(esColor){
        r.base = N($("#rB",d).value) || 100; r.muestra = $("#rM",d).value;
        const q = N($("#rQ",d).value), k = q / r.base;
        const totG = comps.reduce((a,c)=>a+N(c.gotas),0);

        const cera = N($("#rW",d).value);
        let q = N($("#rQ",d).value), titulo = `Para preparar ${f1(q)} ${r.unidad}`;
        if(cera > 0){ const g = cera * r.carga / 100; q = r.unidad === "ml" ? g / (N(S.cfg.densEsencia)||0.95) : g; titulo = `Para ${f1(cera)} g de cera al ${f1(r.carga)}% necesitas ${f1(q)} ${r.unidad} de fragancia`; }
