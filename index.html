          ${Math.abs(tot-100)>0.05?`<p class="hint" style="margin:8px 0 0">Como no suman 100%, repartí proporcionalmente.</p>`:""}` : "";
      }
    };
    d.querySelectorAll("#rB,#rM,#rQ,#rU,#rC,#rW").forEach(el => el.oninput = el.onchange = calc);
    $("#rA",d).onclick = () => { r.componentes.push(esColor ? {nombre:"", gotas:1} : {nombre:"", pct:0}); draw(); };
    $("#rG",d).onclick = async () => {
      r.nombre = $("#rN",d).value.trim(); r.notas = $("#rNo",d).value;
      if(!r.nombre){ $("#rN",d).focus(); toast("Ponle nombre"); return; }
      r.componentes = r.componentes.filter(c=>c.nombre.trim() || N(esColor?c.gotas:c.pct));
      if(!r.componentes.length){ toast(esColor ? "Agrega al menos un colorante" : "Agrega al menos una esencia"); return; }
      const { id, ...body } = r;
      if(await saveDoc("recetas", id, body)){ close(); toast(esColor ? "Color guardado" : "Fragancia guardada"); }
    };
    $("#rD",d).onclick = e => confirmDelete(e.target, async () => { if(await delDoc("recetas", r.id)){ close(); toast("Borrado"); } });
    draw();
  });
}

// ---------- compras: precios por proveedor ----------
const UNIDADES = { g:["g",1], kg:["g",1000], ml:["ml",1], l:["ml",1000], cm:["cm",1], m:["cm",100], und:["und",1] };
const BASE_TXT = { g:["1 kg",1000], ml:["1 litro",1000], cm:["1 metro",100], und:["1 unidad",1] };
function precioUnit(r){ const u = UNIDADES[r.unidad] || ["und",1]; const base = N(r.cantidad) * u[1]; return base > 0 ? { base:u[0], porBase: N(r.precio)/base } : null; }
function rCompras(m){
  const grupos = {};
  S.precios.forEach(r => { const pu = precioUnit(r); if(!pu) return; const k = (r.insumo||"").trim().toLowerCase() + "|" + pu.base; (grupos[k] ||= { insumo:(r.insumo||"").trim(), base:pu.base, filas:[] }).filas.push({ ...r, pu:pu.porBase }); });
  const lista = Object.values(grupos).sort((a,b)=>a.insumo.localeCompare(b.insumo));
  m.innerHTML = `
  <div class="sec-head"><div><h2>Compras</h2><p class="lede">Anota lo que cuesta cada insumo en cada proveedor y la presentación en que lo venden. Te comparo el precio por kilo, litro, metro o unidad para que sepas dónde comprar más barato.</p></div>
  <button class="btn primary" id="nuevoPr">+ Nuevo precio</button></div>
  <div class="stack">${lista.length ? lista.map(g => {
    g.filas.sort((a,b)=>a.pu-b.pu);
    const min = g.filas[0].pu, [txt, mult] = BASE_TXT[g.base] || ["1 unidad",1];
    return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">${esc(g.insumo)}</h3><span class="hint">Precio por ${txt}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Proveedor</th><th>Presentación</th><th class="r">Precio</th><th class="r">Por ${txt}</th><th></th></tr></thead><tbody>
    ${g.filas.map((r,i)=>`<tr class="click" data-prid="${esc(r.id)}"><td><b>${esc(r.proveedor||"—")}</b>${r.notas?`<div class="hint">${esc(r.notas)}</div>`:""}</td><td class="num">${N(r.cantidad)} ${esc(r.unidad)}</td><td class="r num">${$$(r.precio)}</td><td class="r num"><b>${$$(r.pu*mult)}</b></td><td>${i===0?`<span class="pill ok">Más barato</span>`:`<span class="pill">+${Math.round((r.pu/min-1)*100)}%</span>`}</td></tr>`).join("")}
    </tbody></table></div>${g.filas.length > 1 ? `<p class="hint" style="margin:8px 0 0">Comprando en ${esc(g.filas[0].proveedor||"el más barato")} ahorras ${$$((g.filas[g.filas.length-1].pu - min)*mult)} por cada ${txt} frente al más caro.</p>` : `<p class="hint" style="margin:8px 0 0">Agrega otro proveedor de ${esc(g.insumo)} para comparar.</p>`}</div>`;
  }).join("") : `<div class="empty"><strong>Aún no hay precios</strong>Anota, por ejemplo, la cera de soya en dos proveedores distintos y te digo cuál sale más barata por kilo.</div>`}</div>`;
  $("#nuevoPr").onclick = () => editPrecio(null);
  m.querySelectorAll("[data-prid]").forEach(r => r.onclick = () => editPrecio(S.precios.find(x=>x.id===r.dataset.prid)));
}
function editPrecio(r0){
  const isNew = !r0;
  const r = { ...(r0 || { id:uid(), insumo:"", proveedor:"", cantidad:"", unidad:"g", precio:"", fecha:ymd(today()), notas:"" }) };
  const insumos = [...new Set([...S.precios.map(x=>x.insumo), ...S.fichas.flatMap(f=>(f.insumos||[]).map(i=>i.nombre))].filter(Boolean))];
  const provs = [...new Set(S.precios.map(x=>x.proveedor).filter(Boolean))];
  drawer(isNew ? "Nuevo precio" : "Precio", `
    <label for="prI">Insumo<input id="prI" list="dlI" value="${esc(r.insumo)}" placeholder="Ej. Cera de soya"><datalist id="dlI">${insumos.map(v=>`<option value="${esc(v)}">`).join("")}</datalist></label>
    <label for="prP">Proveedor<input id="prP" list="dlP" value="${esc(r.proveedor)}" placeholder="Ej. Tienda Velas Bogotá"><datalist id="dlP">${provs.map(v=>`<option value="${esc(v)}">`).join("")}</datalist></label>
    <div class="grid"><label for="prC">Presentación<input id="prC" type="number" min="0" step="any" value="${esc(r.cantidad)}" placeholder="Ej. 1"></label>
    <label for="prU">Unidad<select id="prU">${Object.keys(UNIDADES).map(u=>`<option value="${u}" ${r.unidad===u?"selected":""}>${{g:"gramos",kg:"kilos",ml:"mililitros",l:"litros",cm:"centímetros",m:"metros",und:"unidades"}[u]}</option>`).join("")}</select></label>
    <label for="prV">Precio ($)<input id="prV" type="number" min="0" step="100" value="${esc(r.precio)}"></label></div>
    <div class="grid"><label for="prF">Fecha del precio<input id="prF" type="date" value="${esc(r.fecha)}"></label></div>
    <label for="prN">Notas<input id="prN" value="${esc(r.notas)}" placeholder="Ej. incluye envío, mínimo 5 kg"></label>
    <div class="panel" id="prS"></div>
    <div class="row" style="justify-content:space-between"><button class="btn danger" id="prD" ${isNew?"hidden":""}>Borrar</button><button class="btn primary" id="prG">Guardar precio</button></div>`,
  (d, close) => {
    const sum = () => { const tmp = { cantidad:$("#prC",d).value, unidad:$("#prU",d).value, precio:$("#prV",d).value }; const pu = precioUnit(tmp); const [txt, mult] = pu ? BASE_TXT[pu.base] : ["",1]; $("#prS",d).innerHTML = pu && N(tmp.precio) ? `<dl class="kv"><dt>Precio por ${txt}</dt><dd class="num"><b>${$$(pu.porBase*mult)}</b></dd></dl>` : `<p class="hint" style="margin:0">Escribe presentación y precio para ver el precio por kilo, litro, metro o unidad.</p>`; };
    ["prC","prU","prV"].forEach(id => $("#"+id,d).oninput = $("#"+id,d).onchange = sum); sum();
    $("#prG",d).onclick = async () => {
      const body = { insumo:$("#prI",d).value.trim(), proveedor:$("#prP",d).value.trim(), cantidad:N($("#prC",d).value), unidad:$("#prU",d).value, precio:N($("#prV",d).value), fecha:$("#prF",d).value, notas:$("#prN",d).value.trim() };
      if(!body.insumo){ $("#prI",d).focus(); toast("Escribe el insumo"); return; }
      if(!body.cantidad || !body.precio){ toast("Pon la presentación y el precio"); return; }
      if(await saveDoc("precios", r.id, body)){ close(); toast("Precio guardado"); }
    };
    $("#prD",d).onclick = e => confirmDelete(e.target, async () => { if(await delDoc("precios", r.id)){ close(); toast("Precio borrado"); } });
  });
}

// ---------- datos (guardados en este dispositivo) ----------
const KEY = "magma-mecha-datos-v1";
const store = { pedidos:{}, moldes:{}, fichas:{}, combos:{}, precios:{}, recetas:{}, inventario:{}, clientes:{}, config:{}, meta:{} };
function loadStore(){
  try { const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); ["pedidos","moldes","fichas","combos","precios","recetas","inventario","clientes","config","meta"].forEach(k => store[k] = d[k] || {}); } }
  catch(e){ S.storageError = true; }
  syncState();
}
function syncState(){
  const list = o => Object.entries(o).map(([id,b]) => ({ id, ...b }));
  S.pedidos = list(store.pedidos); S.moldes = list(store.moldes); S.fichas = list(store.fichas); S.combos = list(store.combos); S.precios = list(store.precios); S.recetas = list(store.recetas); S.inventario = list(store.inventario); S.clientes = list(store.clientes);
  S.cfg = { ...DEFAULT_CFG, ...(store.config.ajustes || {}) };
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); return true; }
  catch(e){ toast("No hay espacio para guardar en este dispositivo. Descarga una copia y borra pedidos viejos."); return false; }
}
async function saveDoc(col, id, body, quiet){
  const prev = store[col][id];
  store[col][id] = body;
  if(!persist()){ if(prev) store[col][id] = prev; else delete store[col][id]; return false; }
  syncState();
  if(col !== "config") render();
  cloudSet(col, id, body);
  return true;
}
async function delDoc(col, id){
  const prev = store[col][id];
  delete store[col][id];
  if(!persist()){ store[col][id] = prev; return false; }
  syncState(); render();
  cloudDel(col, id);
  return true;
}

// ---------- sincronización en la nube (Firebase) ----------
const FB_CONFIG = {
  apiKey: "AIzaSyD67UejuKYzXELmUAeI8CVvKc89x-5p9Uk",
  authDomain: "magma-mecha.firebaseapp.com",
  projectId: "magma-mecha",
  storageBucket: "magma-mecha.firebasestorage.app",
  messagingSenderId: "609538390838",
  appId: "1:609538390838:web:ab35255f55b7bbe4ca5197"
};
const COLS = ["pedidos","moldes","fichas","combos","precios","recetas","inventario","clientes","config"];
const SYNC = { ok:false, user:null, fs:null, auth:null, unsubs:[], estado:"local", error:"" };
function initCloud(){
  if(!window.firebase){ SYNC.estado = "sin-sdk"; paintSync(); return; }
  try {
    firebase.initializeApp(FB_CONFIG);
    SYNC.auth = firebase.auth(); SYNC.fs = firebase.firestore();
    SYNC.fs.enablePersistence({ synchronizeTabs:true }).catch(()=>{});
    SYNC.ok = true;
    SYNC.auth.getRedirectResult().catch(e => { SYNC.error = authMsg(e); paintSync(); });
    SYNC.auth.onAuthStateChanged(u => { if(u) conectar(u); else desconectar(); });
  } catch(e){ SYNC.estado = "sin-sdk"; paintSync(); }
}
function authMsg(e){
  const c = e && e.code || "";
  if(c.includes("unauthorized-domain")) return "Firebase no tiene autorizado este dominio. Agrega jeimmymol.github.io en Authentication → Configuración → Dominios autorizados.";
  if(c.includes("operation-not-allowed")) return "El inicio con Google no está habilitado. Actívalo en Authentication → Método de acceso → Google.";
  if(c.includes("popup-closed") || c.includes("cancelled")) return "";
  if(c.includes("network")) return "Sin conexión a internet. Inténtalo cuando tengas señal.";
  return "No se pudo iniciar sesión (" + (c || "error") + ").";
}
async function iniciarSesion(){
  if(!SYNC.ok){ toast("La sincronización necesita internet la primera vez."); return; }
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt:"select_account" });
  SYNC.error = "";
  try { await SYNC.auth.signInWithPopup(prov); }
  catch(e){
    if((e.code||"").includes("popup-blocked") || (e.code||"").includes("operation-not-supported")){ try { await SYNC.auth.signInWithRedirect(prov); return; } catch(e2){ e = e2; } }
    SYNC.error = authMsg(e); paintSync(); if(SYNC.error) toast(SYNC.error);
  }
}
const userCol = (col) => SYNC.fs.collection("usuarios").doc(SYNC.user.uid).collection(col);
async function conectar(u){
  SYNC.user = u; SYNC.estado = "subiendo"; paintSync();
  try {
    // 1. sube lo que este dispositivo tenga y la nube no
    for(const col of COLS){
      const snap = await userCol(col).get();
      const remotos = new Set(snap.docs.map(d => d.id));
      const faltan = Object.entries(store[col]).filter(([id]) => !remotos.has(id));
      for(let i = 0; i < faltan.length; i += 400){
        const b = SYNC.fs.batch();
        faltan.slice(i, i+400).forEach(([id, body]) => b.set(userCol(col).doc(id), body));
        await b.commit();
      }
    }
    // 2. escucha los cambios de la nube
    SYNC.unsubs.forEach(f => f()); SYNC.unsubs = [];
    COLS.forEach(col => SYNC.unsubs.push(userCol(col).onSnapshot({ includeMetadataChanges:true }, snap => {
      const o = {}; snap.docs.forEach(d => o[d.id] = d.data());
      store[col] = o; persist(); syncState();
      SYNC.estado = (snap.metadata.fromCache && !navigator.onLine) ? "sin-red" : snap.metadata.hasPendingWrites ? "subiendo" : "ok"; paintSync();
      const typing = document.activeElement && document.activeElement.closest("#main") && document.activeElement.matches("input,select,textarea");
      if(!$("#ov") && !typing) render();
    }, e => { SYNC.estado = "error"; SYNC.error = "La nube rechazó la conexión. Revisa las reglas de Firestore."; paintSync(); })));
  } catch(e){
    SYNC.estado = "error";
    SYNC.error = (e.code||"").includes("permission") ? "La nube rechazó la conexión. Revisa que publicaste las reglas de Firestore." : "No se pudo conectar con la nube. Tus datos siguen guardados en este equipo.";
    paintSync();
  }
}
function desconectar(){ SYNC.unsubs.forEach(f => f()); SYNC.unsubs = []; SYNC.user = null; SYNC.estado = "local"; paintSync(); }
function cloudSet(col, id, body){ if(SYNC.user && SYNC.fs) userCol(col).doc(id).set(body).catch(()=>{ toast("Guardado en el equipo; no se pudo subir a la nube."); }); }
function cloudDel(col, id){ if(SYNC.user && SYNC.fs) userCol(col).doc(id).delete().catch(()=>{}); }
async function reemplazarNube(){
  if(!SYNC.user) return;
  for(const col of COLS){
    const snap = await userCol(col).get();
    const ops = [];
    snap.docs.forEach(d => { if(!store[col][d.id]) ops.push(["del", d.id]); });
    Object.entries(store[col]).forEach(([id, body]) => ops.push(["set", id, body]));
    for(let i = 0; i < ops.length; i += 400){
      const b = SYNC.fs.batch();
      ops.slice(i, i+400).forEach(o => o[0] === "del" ? b.delete(userCol(col).doc(o[1])) : b.set(userCol(col).doc(o[1]), o[2]));
      await b.commit();
    }
  }
}
function paintSync(){
  const b = $("#btnSync"); if(!b) return;
  const txt = { local:"Sincronizar", subiendo:"Subiendo…", ok:"✓ Sincronizado", "sin-red":"Sin red · guarda aquí", error:"⚠ Sincronizar", "sin-sdk":"Sincronizar" }[SYNC.estado] || "Sincronizar";
  b.textContent = txt;
  b.style.color = SYNC.estado === "ok" ? "var(--ok)" : SYNC.estado === "error" ? "var(--bad)" : "";
}
function abrirSync(){
  const u = SYNC.user;
  drawer("Sincronizar equipos", u ? `
    <p class="lede" style="margin:0">Estás conectada como <b>${esc(u.email || u.displayName || "")}</b>. Lo que anotes aquí aparece en tus otros equipos donde inicies sesión con la misma cuenta.</p>
    <div class="panel"><dl class="kv"><dt>Estado</dt><dd>${SYNC.estado === "ok" ? "Al día" : SYNC.estado === "sin-red" ? "Sin internet: guardo aquí y subo al volver la señal" : SYNC.estado === "error" ? "Con problemas" : "Conectando…"}</dd>
    <dt>Pedidos</dt><dd class="num">${S.pedidos.length}</dd><dt>Moldes</dt><dd class="num">${S.moldes.length}</dd><dt>Fichas</dt><dd class="num">${S.fichas.length}</dd></dl></div>
    ${SYNC.error ? `<p class="hint" style="color:var(--bad);margin:0">${esc(SYNC.error)}</p>` : ""}
    <button class="btn" id="sOut">Cerrar sesión en este equipo</button>
    <p class="hint" style="margin:0">Al cerrar sesión tus datos se quedan guardados en este equipo, pero deja de sincronizar.</p>` : `
    <p class="lede" style="margin:0">Inicia sesión con tu cuenta de Google en cada equipo (portátil, celular, computador de escritorio) y tus pedidos, moldes y fichas se mantienen iguales en todos.</p>
    <p class="hint" style="margin:0">La primera vez subo a la nube lo que ya tengas en este equipo; no se borra nada. Usa siempre la misma cuenta de Google.</p>
    ${SYNC.error ? `<p class="hint" style="color:var(--bad);margin:0">${esc(SYNC.error)}</p>` : ""}
    <button class="btn primary" id="sIn">Iniciar sesión con Google</button>`,
  (d, close) => {
    const i = $("#sIn",d); if(i) i.onclick = async () => { await iniciarSesion(); if(SYNC.user) close(); };
    const o = $("#sOut",d); if(o) o.onclick = async () => { await SYNC.auth.signOut(); close(); toast("Sesión cerrada en este equipo"); };
  });
}
function diasSinRespaldo(){ const t = store.meta.ultimoRespaldo; return t ? Math.floor((Date.now() - new Date(t)) / 86400000) : null; }
function hayDatos(){ return S.pedidos.length + S.moldes.length + S.fichas.length > 0; }
function descargarRespaldo(){
  const data = { app:"Magma & Mecha", version:1, fecha:new Date().toISOString(), pedidos:store.pedidos, moldes:store.moldes, fichas:store.fichas, combos:store.combos, precios:store.precios, recetas:store.recetas, inventario:store.inventario, clientes:store.clientes, config:store.config };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type:"application/json" });
  const name = `magma-mecha-respaldo-${ymd(new Date())}.json`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  store.meta.ultimoRespaldo = new Date().toISOString(); persist();
  toast("Copia descargada: " + name); render();
}
function restaurarRespaldo(file, done){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if(d.app !== "Magma & Mecha" || !d.pedidos) throw new Error("formato");
      const antes = JSON.stringify(store);
      ["pedidos","moldes","fichas","combos","precios","recetas","inventario","clientes","config"].forEach(k => store[k] = d[k] || {});
      if(!persist()){ Object.assign(store, JSON.parse(antes)); return; }
      syncState(); render(); done && done();
      reemplazarNube().catch(()=>toast("Restaurado en este equipo; no se pudo actualizar la nube."));
      toast(`Copia restaurada: ${S.pedidos.length} pedidos, ${S.moldes.length} moldes, ${S.fichas.length} fichas`);
    } catch(e){ toast("Ese archivo no es una copia de Magma & Mecha. Elige el archivo .json que descargaste."); }
  };
  r.readAsText(file);
}
function abrirRespaldo(){
  const ds = diasSinRespaldo();
  drawer("Copia de respaldo", `
    <p class="lede" style="margin:0">Tus datos se guardan solo en este dispositivo. Descarga una copia cada semana y guárdala en Drive o envíatela por WhatsApp. Con ese archivo recuperas todo si cambias de celular, o pasas la información al PC.</p>
    <div class="panel"><dl class="kv"><dt>Pedidos</dt><dd class="num">${S.pedidos.length}</dd><dt>Moldes</dt><dd class="num">${S.moldes.length}</dd><dt>Fichas de costeo</dt><dd class="num">${S.fichas.length}</dd>
    <dt>Última copia</dt><dd>${ds === null ? "Nunca" : ds === 0 ? "Hoy" : `Hace ${ds} día${ds===1?"":"s"}`}</dd></dl></div>
    <button class="btn primary" id="rDesc">Descargar copia</button>
    <div class="panel stack"><h3 style="margin:0">Restaurar una copia</h3>
    <p class="hint" style="margin:0">Reemplaza todo lo que hay en este dispositivo por lo que trae el archivo.</p>
    <label for="rFile">Archivo de copia (.json)<input id="rFile" type="file" accept=".json,application/json"></label>
    <button class="btn danger" id="rRest" disabled>Reemplazar mis datos con esta copia</button></div>`,
  (d, close) => {
    $("#rDesc",d).onclick = () => { descargarRespaldo(); close(); };
    const f = $("#rFile",d), b = $("#rRest",d);
    f.onchange = () => { b.disabled = !f.files.length; };
    b.onclick = e => confirmDelete(e.target, () => restaurarRespaldo(f.files[0], close));
  });
}
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
let tt; function toast(msg){ let el = $("#toast"); if(!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(()=>el.hidden=true, 2600); }

// tabs
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x===b));
  try { localStorage.setItem("mm-tab", S.tab); } catch(e){}
  render(); window.scrollTo(0,0);

try { const t = localStorage.getItem("mm-tab"); if(t && document.querySelector(`#tabs [data-tab="${t}"]`)) { S.tab = t; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab===t)); } } catch(e){}

S.db = true; Object.keys(S.loaded).forEach(k => S.loaded[k] = true);
loadStore();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
$("#btnResp").onclick = abrirRespaldo;

render();
})();
